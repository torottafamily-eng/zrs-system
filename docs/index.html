<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>業界ニュース一覧</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  ul { list-style: none; padding: 0; }
  li { padding: 0.75rem 0; border-bottom: 1px solid #eee; }
  a { color: #222; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .empty { color: #888; }
  .more-btn { display: block; width: 100%; margin-top: 1rem; padding: 0.6rem; background: #f5f5f5; border: 1px solid #ddd; border-radius: 4px; color: #333; font-size: 0.9rem; cursor: pointer; }
  .more-btn:hover { background: #eee; }
</style>
</head>
<body>
  <h1>業界ニュース一覧</h1>
  <ul id="list"><li class="empty">読み込み中...</li></ul>
  <script>
    // このプロジェクト用のSupabase Project URLとanon(publishable)キー。
    // anonキーはRLS(Row Level Security)で読み取り専用に制限されているため、
    // クライアント側のコードに埋め込んで公開する設計で問題ない。
    const SUPABASE_URL = "https://osmvsriosaojgcmgwvhk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zbXZzcmlvc2FvamdjbWd3dmhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MDgzNTYsImV4cCI6MjEwMTQ4NDM1Nn0.hQvs3jYdq0YNmwROJM3p5ijmY7jwGBmwcg5jMPVgXv0";
    const INITIAL_COUNT = 6;

    const endpoint = `${SUPABASE_URL}/rest/v1/articles?select=title,url,published_at,created_at&order=created_at.desc`;

    function renderArticle(list, article) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = article.url;
      a.textContent = `→ ${article.title}`;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      li.appendChild(a);
      list.appendChild(li);
    }

    fetch(endpoint, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      },
    })
      .then((res) => res.json())
      .then((articles) => {
        const list = document.getElementById("list");
        list.innerHTML = "";
        if (!Array.isArray(articles) || !articles.length) {
          list.innerHTML = '<li class="empty">まだ記事がありません。</li>';
          return;
        }
        articles.slice(0, INITIAL_COUNT).forEach((article) => renderArticle(list, article));

        const rest = articles.slice(INITIAL_COUNT);
        if (rest.length) {
          const moreBtn = document.createElement("button");
          moreBtn.type = "button";
          moreBtn.className = "more-btn";
          moreBtn.textContent = `他の記事はこちら(残り${rest.length}件)`;
          moreBtn.addEventListener("click", () => {
            rest.forEach((article) => renderArticle(list, article));
            moreBtn.remove();
          });
          list.after(moreBtn);
        }
      })
      .catch(() => {
        document.getElementById("list").innerHTML =
          '<li class="empty">記事一覧の読み込みに失敗しました。</li>';
      });
  </script>
</body>
</html>
