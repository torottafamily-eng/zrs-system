name: Industry News Bot

on:
  schedule:
    # 毎日 23:00 UTC (= JST 8:00) に起動。
    # 「2日に1回」の間隔はスクリプト内(run_state.last_run_at)で制御するため、
    # cron自体は毎日実行でよい(月末月初をまたぐ間隔ズレを避けるため)。
    - cron: "0 23 * * *"
  workflow_dispatch: {}

# GitHubは60日間コミットのないリポジトリのスケジュール実行を自動停止するため、
# Keepaliveステップで最終コミットから45日以上経っていれば空コミットをpushする。
permissions:
  contents: write

concurrency:
  group: industry-news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keepalive (prevent 60-day auto-disable)
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "最終コミットから${days}日"
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (prevent scheduled workflow auto-disable)"
            git push
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          RSS_URL: ${{ secrets.RSS_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py
